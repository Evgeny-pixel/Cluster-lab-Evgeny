# Base scrap config
scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'mon-server-node'
    scrape_interval: 15s
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'app-server-node'
    scrape_interval: 15s
    static_configs:
      - targets: ['172.16.0.2:9100']

  - job_name: 'log-server-node'
    scrape_interval: 15s
    static_configs:
      - targets: ['172.16.0.4:9100']

  - job_name: 'app-server-nginx'
    scrape_interval: 15s
    static_configs:
      - targets: ['172.16.0.2:9113']

  - job_name: 'app-server-mysql'
    scrape_interval: 15s
    static_configs:
      - targets: ['172.16.0.2:9104']


rule_files:
  - "/etc/prometheus/alert.rules.yml"


alerting:
  alertmanagers:
    - static_configs:
      - targets: ['alertmanager:9093']
