# Create php-fpm, nginx-server, mysql, node-exporter, nginx-exporter, mysqld-exporter, zabbix-agent and filebeat container
version: '3.8'

networks:
  app_interval:
    driver: bridge

services:
  php:  
    build: /opt/app/php
    container_name: app_php
    restart: unless-stopped
    volumes:
      - /srv/app/wordpress:/var/www/html
      - /var/log/app_logs/wordpress:/var/log/wordpress
    environment:
      WORDPRESS_DB_HOST: "db:3306"
      WORDPRESS_DB_NAME: "wordpress"
      WORDPRESS_DB_USER: "wp_user"
      WORDPRESS_DB_PASSWORD: "1111"
    depends_on:
      - db
    networks:
      - app_interval

  web:
    image: nginx:1.25-alpine
    container_name: app_web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - /srv/app/wordpress:/var/www/html:ro
      - /etc/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/log/app_logs/nginx:/var/log/nginx
    depends_on:
      - php
    networks:
      - app_interval
    
  db:
    image: mysql:8.0
    container_name: app_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "root9999"
      MYSQL_DATABASE: "wordpress"
      MYSQL_USER: "wp_user"
      MYSQL_PASSWORD: "1111"
    volumes:
      - /var/lib/mysql:/var/lib/mysql
      - /var/log/app_logs/mysql:/var/log/mysql
    command:
      - '--log-error=/var/log/mysql/error.log'
      - '--slow_query_log=1'
      - '--slow_query_log_file=/var/log/mysql/slow.log'
      - '--long_query_time=2'
    networks:  
      - app_interval

  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: app_node_exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'  
      - '--path.rootfs=/rootfs'
    networks:
      - app_interval

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.0.0
    container_name: app_nginx_exporter
    restart: unless-stopped
    ports:
      - "9113:9113"
    command:
      - '-nginx.scrape-uri=http://web:80/stub_status'
    depends_on:
      - web
    networks:
      - app_interval

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.0
    container_name: app_mysqld_exporter
    restart: unless-stopped
    ports:
      - "9104:9104"
    volumes:
      - /etc/mysqld_exporter/.my.cnf:/cfg/.my.cnf
    command:
      - '--config.my-cnf=/cfg/.my.cnf'
    environment:
      DATA_SOURCE_NAME: "root:root9999@(db:3306)/"
    depends_on:
      - db
    networks:
      - app_interval

  zabbix-agent:
    image: zabbix/zabbix-agent2:alpine-6.4-latest
    container_name: app_zabbix_agent
    restart: unless-stopped
    ports:
      - "10050:10050"
    environment:
      ZBX_SERVER_HOST: "172.16.0.3"
      ZBX_SERVER_ACTIVE: "172.16.0.3"
      ZBX_HOSTNAME: "app-server"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /dev:/host/dev:ro
    networks:
      - app_interval

  filebeat:
    image: docker.elastic.co/beats/filebeat:7.17.18
    container_name: app_filebeat
    restart: unless-stopped
    user: root
    volumes:
      - /etc/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/log/app_logs:/var/log/app_logs:ro
      - /var/log/syslog:/var/log/syslog:ro
      - /srv/app/filebeat_data:/usr/share/filebeat/data
    depends_on:
      - web
      - php
      - db
    networks:
      - app_interval
