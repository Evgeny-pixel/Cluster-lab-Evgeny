input {
  beats {
    port => 5044
  }
}

filter {
  if [stream] not in ["nginx_access", "nginx_error", "wordpress_debug", "mysql_logs", "system_logs"] {
    drop {}
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "logs-%{[stream]}-%{+YYYY.MM.dd}"
    action => "create"
  }
}
